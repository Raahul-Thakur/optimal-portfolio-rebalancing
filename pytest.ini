[pytest]
testpaths = tests
python_files = test_*.py
# Deliberately no -q here.  Setting verbosity in addopts composes badly: a
# `pytest -q` on the command line then means -q -q, which silently suppresses
# the final "N passed" summary line and leaves you reading dots.
addopts = --strict-markers
filterwarnings =
    error::DeprecationWarning:src.*
markers =
    slow: end-to-end runs of scripts/run_all.py (about a minute each; skip with -m "not slow")
